name: Build Kebab A13
on:
  push:
    branches: [ A13 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: A13
          fetch-depth: 1

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm libncurses-dev gcc-aarch64-linux-gnu

      - name: Fix Broken Configs
        run: |
          # Видаляємо зламаний драйвер з конфігурації, щоб він не зупиняв білд
          sed -i '/rt18192eu/d' drivers/staging/Kconfig
          sed -i '/rt18192eu/d' drivers/staging/Makefile

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out vendor/kebab_defconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kebab-Kernel-A13
          path: out/arch/arm64/boot/Image.gz-dtb
