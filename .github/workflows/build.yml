name: Build Meteoric Stable 13.1
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: 13.1-new

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm libncurses-dev gcc-aarch64-linux-gnu

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # 1. Створюємо базовий конфіг
          make O=out vendor/meteoric_defconfig
          
          # 2. Виправляємо нові опції конфігурації автоматично
          make O=out ARCH=arm64 CC=clang olddefconfig
          
          # 3. НАШ ФАСТ-ТРЕК: Компілюємо суто папку з нашим містком!
          # Перевірка займе близько хвилини.
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip drivers/misc/
          
          # 4. Якщо все чисто — запускаємо повну збірку всього ядра
          make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

      - name: Upload Kernel and Modules
        uses: actions/upload-artifact@v4
        with:
          name: Meteoric-Kebab-Stable
          path: |
            out/arch/arm64/boot/Image*
            out/drivers/beast_mode/backdr84.ko
