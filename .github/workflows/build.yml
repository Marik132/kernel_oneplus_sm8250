name: Build Kebab A13
on:
  push:
    branches: [ A13 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: A13

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm libncurses-dev gcc-aarch64-linux-gnu

      - name: Force Fix Driver Error
        run: |
          # Створюємо папку, якої не вистачає
          mkdir -p drivers/staging/rt18192eu
          
          # Створюємо фейковий Kconfig, щоб make не "панікував"
          echo "config RTL8192EU" > drivers/staging/rt18192eu/Kconfig
          echo "    tristate \"Realtek 8192EU USB WiFi\"" >> drivers/staging/rt18192eu/Kconfig
          echo "    depends on USB && WLAN" >> drivers/staging/rt18192eu/Kconfig
          echo "    default n" >> drivers/staging/rt18192eu/Kconfig
          
          # Створюємо порожній Makefile
          touch drivers/staging/rt18192eu/Makefile
          
          # Вимикаємо цей драйвер у нашому дефконфігу про всяк випадок
          sed -i 's/CONFIG_RTL8192EU=y/CONFIG_RTL8192EU=n/g' arch/arm64/configs/vendor/kebab_defconfig || true

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Готуємо конфігурацію
          make O=out vendor/kebab_defconfig
          
          # Запускаємо компіляцію ядра
          make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kebab-Kernel-A13
          path: out/arch/arm64/boot/Image.gz-dtb
